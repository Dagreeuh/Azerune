<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sim Survie Forever</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Marcellus+SC&display=swap">
<style>
/* Carnet de pisteur : réglages à gauche, résultats à droite, une seule colonne sur téléphone. */
:root {
  --bg: #eef1ea;
  --surface: #fbfcf8;
  --surface-2: #f3f6ef;
  --ink: #1c231a;
  --muted: #5a6656;
  --line: #d3dacb;
  --accent: #3f6b26;
  --accent-ink: #ffffff;
  --accent-soft: #e3ecd9;
  --mark: #4a7a2e;
  --mark-hover: #365c1f;
  --amber: #8a5a0e;
  --amber-soft: #f6ead2;
  --blue: #2c5d8a;
  --blue-soft: #e1ebf4;
  --green: #2f6b33;
  --green-soft: #dfeedd;
  --grey: #555b52;
  --grey-soft: #e6e8e3;
  --danger: #a23a2a;
  --danger-soft: #f6e0dc;
  --shadow: 0 1px 2px rgb(28 35 26 / 0.06), 0 6px 18px rgb(28 35 26 / 0.06);
  /* Une couleur par technique (palette catégorielle validée) et l’encre lisible dessus. */
  --s1: #2a78d6; --s1-ink: #ffffff;
  --s2: #eb6834; --s2-ink: #1c231a;
  --s3: #1baf7a; --s3-ink: #10241a;
  --s4: #eda100; --s4-ink: #1c231a;
  --s5: #e87ba4; --s5-ink: #1c231a;

  --font-display: 'Marcellus SC', 'Cinzel', Georgia, serif;
  --font-body: 'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  --radius: 10px;
  --gap: 16px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121611;
    --surface: #1a1f18;
    --surface-2: #20271e;
    --ink: #e5ebe0;
    --muted: #9ba696;
    --line: #303a2d;
    --accent: #8fc263;
    --accent-ink: #13180f;
    --accent-soft: #263321;
    --mark: #6c9e44;
    --mark-hover: #86b95b;
    --amber: #e0a446;
    --amber-soft: #3a2c13;
    --blue: #8db8e0;
    --blue-soft: #1c2b3a;
    --green: #8fcf8a;
    --green-soft: #1e3320;
    --grey: #b3bbae;
    --grey-soft: #2a3028;
    --danger: #e2826f;
    --danger-soft: #3a1d17;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 6px 18px rgb(0 0 0 / 0.25);
    --s1: #3987e5; --s1-ink: #0d1520;
    --s2: #d95926; --s2-ink: #140c08;
    --s3: #199e70; --s3-ink: #06140e;
    --s4: #c98500; --s4-ink: #140f02;
    --s5: #d55181; --s5-ink: #16080e;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #121611;
  --surface: #1a1f18;
  --surface-2: #20271e;
  --ink: #e5ebe0;
  --muted: #9ba696;
  --line: #303a2d;
  --accent: #8fc263;
  --accent-ink: #13180f;
  --accent-soft: #263321;
  --mark: #6c9e44;
  --mark-hover: #86b95b;
  --amber: #e0a446;
  --amber-soft: #3a2c13;
  --blue: #8db8e0;
  --blue-soft: #1c2b3a;
  --green: #8fcf8a;
  --green-soft: #1e3320;
  --grey: #b3bbae;
  --grey-soft: #2a3028;
  --danger: #e2826f;
  --danger-soft: #3a1d17;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 6px 18px rgb(0 0 0 / 0.25);
  --s1: #3987e5; --s1-ink: #0d1520;
  --s2: #d95926; --s2-ink: #140c08;
  --s3: #199e70; --s3-ink: #06140e;
  --s4: #c98500; --s4-ink: #140f02;
  --s5: #d55181; --s5-ink: #16080e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
}

.app {
  max-width: 1360px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 20px 40px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

h1, h2, h3 { text-wrap: balance; margin: 0; }
h1, h2 { font-family: var(--font-display); font-weight: 400; letter-spacing: 0.02em; }
h1 { font-size: clamp(1.6rem, 3vw, 2.2rem); line-height: 1.1; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
small, .muted { color: var(--muted); }

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* En-tête */
.top {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
}
.brand { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.eyebrow {
  font-size: 0.78rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 700;
}
.brand p { color: var(--muted); max-width: 62ch; }

.profile-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  flex: 1 1 380px;
  max-width: 620px;
}
.profile-bar select { flex: 1 1 100%; min-width: 0; }
@media (max-width: 980px) {
  .profile-bar { justify-content: flex-start; max-width: none; }
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 36px;
  padding: 6px 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  font-weight: 500;
}
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn.small { min-height: 30px; padding: 3px 10px; font-size: 0.9rem; }
.btn.ghost { background: transparent; }

input[type="number"], input[type="text"], select, textarea {
  min-height: 34px;
  padding: 4px 8px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface);
  width: 100%;
}
input[type="number"] { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
textarea { font-family: var(--font-mono); font-size: 0.82rem; min-height: 120px; resize: vertical; }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; flex: none; }

/* Mise en page principale */
.layout {
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
  gap: 20px;
  align-items: start;
}
@media (max-width: 980px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
}

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
}
.panel-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}
.column { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

/* Feuille de personnage */
.sheet {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.sheet > div {
  background: var(--surface-2);
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
@media (max-width: 560px) {
  .sheet { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.sheet .k { font-size: 0.78rem; color: var(--muted); }
.sheet .v { font-variant-numeric: tabular-nums; font-size: 1.02rem; font-weight: 700; }
.sheet .v.warn { color: var(--amber); }

/* Onglets */
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.tab {
  border: 1px solid transparent;
  background: transparent;
  padding: 6px 12px;
  border-radius: 8px;
  color: var(--muted);
  font-weight: 500;
}
.tab:hover { color: var(--ink); background: var(--surface-2); }
.tab[aria-selected="true"] { color: var(--ink); background: var(--accent-soft); border-color: var(--line); font-weight: 700; }

.section-stack { display: flex; flex-direction: column; gap: 14px; }
.section { display: flex; flex-direction: column; gap: 10px; }
.section + .section { padding-top: 14px; border-top: 1px dashed var(--line); }
.section-title { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
.hint { font-size: 0.9rem; color: var(--muted); }

.fields {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px 12px;
}
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 0.85rem; color: var(--muted); }
.check {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 34px;
}
.check span { min-width: 0; }

.segmented { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.segmented button { border: 0; background: var(--surface); padding: 6px 12px; color: var(--muted); }
.segmented button + button { border-left: 1px solid var(--line); }
.segmented button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }

/* Talents */
.talent-list { display: flex; flex-direction: column; }
.talent {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 4px 12px;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
}
.talent:last-child { border-bottom: 0; }
.talent .name { font-weight: 700; }
.talent .tree { font-size: 0.78rem; color: var(--muted); margin-left: 6px; font-weight: 400; }
.talent .desc { grid-column: 1; font-size: 0.88rem; color: var(--muted); }
.stepper { display: inline-flex; align-items: center; gap: 4px; grid-row: 1 / span 2; grid-column: 2; }
.stepper button { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); }
.stepper .num { min-width: 42px; text-align: center; }
.talent.off .name { color: var(--muted); }

/* Buffs */
.buff-group { display: flex; flex-direction: column; gap: 2px; }
.buff-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0 14px; }

/* Rotation */
.rotation { display: flex; flex-direction: column; gap: 6px; }
.rot-row {
  display: grid;
  grid-template-columns: auto auto minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface-2);
}
.rot-row .rank { font-family: var(--font-mono); color: var(--muted); width: 1.5em; text-align: right; }
.rot-row .rot-name { display: flex; flex-direction: column; min-width: 0; }
.rot-row .rot-name small { font-size: 0.82rem; }
.rot-row .mana { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--muted); }
.rot-row .mana input { width: 64px; }
.rot-row .moves { display: flex; gap: 4px; }
.rot-row.disabled { opacity: 0.6; }
@media (max-width: 560px) {
  .rot-row { grid-template-columns: auto auto minmax(0, 1fr); }
  .rot-row .mana, .rot-row .moves { grid-column: 3; }
}

/* Hypothèses */
.mech-group { display: flex; flex-direction: column; }
.mech {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(110px, 180px);
  gap: 4px 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
  align-items: start;
}
.mech:last-child { border-bottom: 0; }
.mech .label { font-weight: 500; }
.mech .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--muted); }
.mech .meta a { color: var(--muted); }
.mech .control { display: flex; align-items: center; gap: 6px; grid-column: 2; grid-row: 1 / span 2; }
.mech.changed .label::after { content: ' · modifié'; color: var(--amber); font-weight: 700; font-size: 0.82rem; }
@media (max-width: 560px) {
  .mech { grid-template-columns: minmax(0, 1fr); }
  .mech .control { grid-column: 1; grid-row: auto; }
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 1px 8px;
  border-radius: 999px;
  font-size: 0.74rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  white-space: nowrap;
  border: 1px solid transparent;
}
.chip::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.officiel { background: var(--green-soft); color: var(--green); }
.chip.communaute { background: var(--blue-soft); color: var(--blue); }
.chip.classic { background: var(--grey-soft); color: var(--grey); }
.chip.estime { background: var(--amber-soft); color: var(--amber); }
.chip.stale { background: var(--amber-soft); color: var(--amber); }
.chip.fresh { background: var(--green-soft); color: var(--green); }

/* Résultats */
.runbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.runbar label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 0.9rem; }
.runbar select { width: auto; }
.progress { height: 4px; background: var(--grey-soft); border-radius: 4px; overflow: hidden; }
.progress > i { display: block; height: 100%; width: 0; background: var(--mark); transition: width 0.12s linear; }

.hero { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 18px; }
.hero .big { font-size: clamp(3rem, 7vw, 4.2rem); font-weight: 700; line-height: 0.95; letter-spacing: -0.01em; }
.hero .unit { font-size: 1rem; color: var(--muted); font-weight: 500; }
.hero .ci { color: var(--muted); }

.stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
@media (max-width: 520px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.stat { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); }
.stat .k { font-size: 0.8rem; color: var(--muted); }
.stat .v { font-weight: 700; font-size: 1.1rem; }

.bars { display: flex; flex-direction: column; gap: 6px; }
.bar-row {
  display: grid;
  grid-template-columns: minmax(110px, 0.9fr) minmax(0, 1.6fr);
  gap: 10px;
  align-items: center;
  padding: 2px 0;
}
.bar-row .bar-label { font-size: 0.92rem; min-width: 0; overflow-wrap: anywhere; }
.bar-track { position: relative; display: flex; align-items: center; gap: 8px; min-width: 0; height: 22px; }
.bar-fill { height: 18px; background: var(--mark); border-radius: 0 4px 4px 0; flex: none; min-width: 2px; width: calc((100% - 7.5em) * var(--ratio, 0)); }
.bar-row:hover .bar-fill, .bar-row:focus-visible .bar-fill { background: var(--mark-hover); }
.bar-value { font-variant-numeric: tabular-nums; font-size: 0.88rem; white-space: nowrap; color: var(--ink); }
.bar-row.current .bar-label { font-weight: 700; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
th, td { padding: 6px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 700; color: var(--muted); background: var(--surface-2); font-size: 0.8rem; }
tbody tr:last-child td { border-bottom: 0; }
td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
td.wrap { white-space: normal; min-width: 12em; }

details summary { cursor: pointer; color: var(--muted); font-size: 0.9rem; }
details[open] summary { margin-bottom: 8px; }

.histo svg { display: block; width: 100%; height: auto; }
.histo .axis text { fill: var(--muted); font-family: var(--font-mono); font-size: 11px; }
.histo .axis line, .histo .grid line { stroke: var(--line); stroke-width: 1; }
.histo .col { fill: var(--mark); }
.histo .col:hover { fill: var(--mark-hover); }
.histo .mean-line { stroke: var(--ink); stroke-width: 1; }
.histo .mean-label { fill: var(--ink); font-size: 11px; font-family: var(--font-body); font-weight: 700; }

.log { max-height: 420px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; font-size: 0.85rem; }
.log-row { display: grid; grid-template-columns: 4.2em 4.6em minmax(0, 1fr); gap: 8px; padding: 3px 10px; border-bottom: 1px solid var(--line); }
.log-row:last-child { border-bottom: 0; }
.log-row .t, .log-row .m { font-family: var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.log-row.cast .txt { font-weight: 700; }
.log-row.proc .txt { color: var(--accent); }

.empty { padding: 14px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); font-size: 0.92rem; }

.notice {
  padding: 10px 12px;
  border-radius: 8px;
  background: var(--amber-soft);
  color: var(--ink);
  font-size: 0.92rem;
  border: 1px solid var(--line);
}

.io { display: flex; flex-direction: column; gap: 8px; }
.io-actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* Sources */
.sources ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 4px; }
.sources li { overflow-wrap: anywhere; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 18px; }
.legend > div { display: flex; flex-direction: column; gap: 4px; max-width: 30ch; }
.legend small { font-size: 0.85rem; }

.tooltip {
  position: fixed;
  z-index: 20;
  pointer-events: none;
  max-width: 280px;
  padding: 8px 10px;
  border-radius: 8px;
  background: var(--ink);
  color: var(--surface);
  font-size: 0.85rem;
  line-height: 1.35;
  box-shadow: var(--shadow);
}
.tooltip strong { display: block; font-size: 1rem; }

/* Onglets de résultats */
.results-tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.progress-wrap { display: flex; flex-direction: column; gap: 6px; }

/* Équipement */
.slots { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.slot-row {
  display: grid;
  grid-template-columns: 8em minmax(0, 1fr) auto;
  gap: 2px 10px;
  align-items: center;
  padding: 6px 10px;
  background: var(--surface-2);
}
.slot-row + .slot-row { border-top: 1px solid var(--line); }
.slot-name { font-weight: 700; font-size: 0.92rem; }
.slot-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.slot-main small { font-size: 0.82rem; overflow-wrap: anywhere; }
.slot-actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
@media (max-width: 620px) {
  .slot-row { grid-template-columns: minmax(0, 1fr); }
  .slot-actions { justify-content: flex-start; }
}
.totals { display: grid; gap: 6px; font-size: 0.92rem; }
.totals > div { display: flex; flex-direction: column; gap: 2px; }
.totals .k { font-size: 0.8rem; color: var(--muted); font-weight: 700; }
.library { display: flex; flex-direction: column; gap: 6px; max-height: 560px; overflow: auto; padding-right: 2px; }
.item-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 6px 12px;
  align-items: center;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface-2);
}
.item-row.equipped { border-color: var(--accent); }
.item-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.item-main small { font-size: 0.82rem; overflow-wrap: anywhere; }
.item-title { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.item-title .name { font-weight: 700; }

.swing { fill: var(--grey); }

const ON_USE_TYPES = {
  ap: 'Puissance d’attaque',

  agi: 'Agilité',
  str: 'Force',
  crit: 'Critique (%)',
};

function slotDef(slotId) {
  return SLOTS.find((s) => s.id === slotId);
}

function canEquip(item, slotId) {
  const slot = slotDef(slotId);
  return !!(item && slot && slot.accepts.includes(item.type));
}

function isWeaponType(type) {
  return type === 'weapon1h' || type === 'weapon2h';
}

function weaponDps(w) {
  if (!w) return 0;
  return ((Number(w.min) || 0) + (Number(w.max) || 0)) / 2 / (Number(w.speed) || 1);
}

function fmtNum(v) {
  return Number(v).toLocaleString('fr-FR', { maximumFractionDigits: 2 });
}

function itemSummary(item) {
  const parts = [];
  if (item.weapon) parts.push(`${fmtNum(item.weapon.min)}–${fmtNum(item.weapon.max)} · ${fmtNum(item.weapon.speed)} s · ${fmtNum(Math.round(weaponDps(item.weapon) * 10) / 10)} DPS`);
  for (const s of ITEM_STATS) {
    const v = Number(item.stats?.[s.key]) || 0;
    if (v) parts.push(s.pct ? `${fmtNum(v)} % ${s.short}` : `${fmtNum(v)} ${s.short}`);
  }
  if (item.onUse?.value) {
    const u = item.onUse;
    parts.push(`Utiliser : +${fmtNum(u.value)}${u.type === 'haste' || u.type === 'crit' ? ' %' : ''} ${ON_USE_TYPES[u.type] || u.type} (${fmtNum(u.duration)} s / ${fmtNum(u.cd)} s)`);
  }
  return parts.join(' · ') || 'Aucune stat';
}

// Équipe un objet en gardant un ensemble cohérent (2M ↔ main gauche).
function equipItem(profile, items, slotId, itemId) {
  const eq = { ...(profile.equipment || {}) };
  const item = items.find((i) => i.id === itemId);
  eq[slotId] = itemId || null;
  if (item && item.type === 'weapon2h' && slotId === 'mainHand') eq.offHand = null;
  if (item && slotId === 'offHand') {
    const main = items.find((i) => i.id === eq.mainHand);
    if (main && main.type === 'weapon2h') eq.mainHand = null;
  }
  profile.equipment = eq;
  return profile;
}

function equippedItems(profile, items) {
  const eq = profile.equipment || {};
  const byId = new Map(items.map((i) => [i.id, i]));
  const out = {};
  for (const slot of SLOTS) {
    const it = byId.get(eq[slot.id]);
    if (it && canEquip(it, slot.id)) out[slot.id] = it;
  }
  if (out.mainHand && out.mainHand.type === 'weapon2h') delete out.offHand;
  return out;
}

// Somme des stats des objets équipés (pour l’affichage).
function equipmentTotals(profile, items) {
  const totals = {};
  for (const it of Object.values(equippedItems(profile, items))) {
    for (const s of ITEM_STATS) {
      const v = Number(it.stats?.[s.key]) || 0;
      if (v) totals[s.key] = (totals[s.key] || 0) + v;
    }
  }
  return totals;
}

// Profil prêt pour le moteur : stats des objets ajoutées aux bonus manuels,
// armes et bijoux à activer repris des objets équipés.
function resolveProfile(profile, items = []) {
  const p = JSON.parse(JSON.stringify(profile));
  const eq = equippedItems(p, items);
  p.gear = { ...(p.gear || {}) };
  let extra = Number(p.extraAttackChance) || 0;

  const main = eq.mainHand && eq.mainHand.weapon ? eq.mainHand : null;
  if (main) {
    p.twoHand = main.type === 'weapon2h';
    p.mh = { ...main.weapon, enchant: p.mh?.enchant || 'none' };
    const off = !p.twoHand && eq.offHand && eq.offHand.weapon ? eq.offHand : null;
    p.oh = off ? { ...off.weapon, enchant: p.oh?.enchant || 'none' } : null;
  }

  for (const it of Object.values(eq)) {
    for (const s of ITEM_STATS) {
      const v = Number(it.stats?.[s.key]) || 0;
      if (!v) continue;
      if (s.key === 'extraAttack') extra += v;
      else if (s.key === 'skill' && Array.isArray(it.skillFor) && it.skillFor.length) {
        if (it.skillFor.includes(p.mh?.type)) p.gear.skill = (Number(p.gear.skill) || 0) + v;
      } else p.gear[s.key] = (Number(p.gear[s.key]) || 0) + v;
    }
  }

  p.trinkets = [0, 1].map((i) => ({ ...((p.trinkets || [])[i] || { preset: 'none' }) }));
  ['trinket1', 'trinket2'].forEach((slot, i) => {
    const it = eq[slot];
    if (it && it.onUse && Number(it.onUse.value)) {
      p.trinkets[i] = { preset: 'custom', name: it.name, type: it.onUse.type, value: it.onUse.value, duration: it.onUse.duration, cd: it.onUse.cd };
    }
  });
  p.extraAttackChance = extra;
  return p;
}

  [/^(ranged|à distance|distance|bow|gun|crossbow|thrown|arc|fusil|arbalète|armes? de jet)\b/i, 'ranged'],
  [/^(head|tête)$/i, 'head'],
  [/^(neck|cou)$/i, 'neck'],
  [/^(shoulders?|épaules?)$/i, 'shoulders'],
  [/^(back|dos)$/i, 'back'],
  [/^(chest|torse)$/i, 'chest'],
  [/^(wrists?|poignets?)$/i, 'wrists'],
  [/^(hands|mains)$/i, 'hands'],
  [/^(waist|taille)$/i, 'waist'],
  [/^(legs|jambes)$/i, 'legs'],
  [/^(feet|pieds)$/i, 'feet'],
  [/^(finger|doigt)$/i, 'finger'],
  [/^(trinket|bijou)$/i, 'trinket'],
];

const WEAPON_WORDS = [
  [/fist|pugilat/i, 'fist'],
  [/polearm|arme d['’]hast/i, 'polearm'],
  [/axe|hache/i, 'axe'],
  [/sword|épée/i, 'sword'],
  [/mace|masse/i, 'mace'],
  [/staff|staves|bâton/i, 'staff'],
  [/dagger|dague/i, 'dagger'],
];

const PRIMARY = [
  [/^(strength|force)$/i, 'str'],
  [/^(agility|agilité)$/i, 'agi'],
  [/^(stamina|endurance)$/i, 'sta'],
  [/^(intellect|intelligence)$/i, 'int'],
  [/^(spirit|esprit)$/i, 'spi'],
];

const IGNORE = /soulbound|binds when|lié quand|^lié|^unique|durability|durabilité|requires|^niveau|item level|niveau d['’]objet|sell price|prix de vente|^classes?\s*:|^\d+\s*(armor|armure)$|^armor|^armure|^"/i;

const PCT = '(\\d+(?:[.,]\\d+)?)\\s*%';

function weaponWord(line) {
  for (const [re, type] of WEAPON_WORDS) if (re.test(line)) return type;
  return null;
}

function parseOnUse(line) {
  const out = {};
  let m;
  if ((m = line.match(/(\d+)\s*(?:attack power|à la puissance d['’]attaque)/i) || line.match(/(?:attack power by|puissance d['’]attaque de)\s*(\d+)/i))) {
    out.type = 'ap';
    out.value = num(m[1]);
  } else if ((m = line.match(new RegExp(`(?:attack speed|vitesse d['’]attaque)[^0-9]*${PCT}`, 'i')))) {
    out.type = 'haste';
    out.value = num(m[1]);
  } else if ((m = line.match(/(?:agility by|agilité de)\s*(\d+)/i))) {
    out.type = 'agi';
    out.value = num(m[1]);
  } else if ((m = line.match(/(?:strength by|force de)\s*(\d+)/i))) {
    out.type = 'str';
    out.value = num(m[1]);
  } else if ((m = line.match(new RegExp(`(?:critical strike|coup critique)[^0-9]*${PCT}`, 'i')))) {
    out.type = 'crit';
    out.value = num(m[1]);
  }
  if ((m = line.match(/(?:for|pendant)\s*(\d+(?:[.,]\d+)?)\s*(sec|s\b|min)/i))) out.duration = num(m[1]) * (/min/i.test(m[2]) ? 60 : 1);
  if ((m = line.match(/\((\d+(?:[.,]\d+)?)\s*(min|sec|s)\b[^)]*\)/i) || line.match(/recharge\s*:?\s*(\d+(?:[.,]\d+)?)\s*(min|sec|s)\b/i))) {
    out.cd = num(m[1]) * (/min/i.test(m[2]) ? 60 : 1);
  }
  return out.type ? out : null;
}

function parseTooltip(text) {
  const lines = String(text || '').split(/\r?\n/).map((l) => l.replace(/\s+/g, ' ').trim()).filter(Boolean);
  const result = { name: '', type: null, stats: {}, weapon: null, onUse: null, skillFor: null, unparsed: [] };
  if (!lines.length) return result;
  result.name = lines[0];
  const add = (key, v) => { result.stats[key] = (result.stats[key] || 0) + v; };
  let weaponType = null;
  let dmg = null;
  let speed = null;

  for (const raw of lines.slice(1)) {
    const line = raw.replace(/^(equip|équipé|équipée)\s*:\s*/i, '');
    let m;
    let used = false;

    for (const [re, type] of TYPE_WORDS) {
      if (re.test(line)) {
        if (!result.type) result.type = type;
        weaponType = weaponType || weaponWord(line);
        used = true;
        break;
      }
    }
    if (used) continue;

    if (!weaponType && /^(axe|sword|mace|polearm|staff|dagger|fist weapon|hache|épée|masse|arme d['’]hast|bâton|dague|arme de pugilat)$/i.test(line)) {
      weaponType = weaponWord(line);
      continue;
    }

    if ((m = line.match(/(\d+)\s*[-–]\s*(\d+)\s*(?:damage|dégâts|points de dégâts)/i) || line.match(/(?:damage|dégâts)\s*:?\s*(\d+)\s*[-–]\s*(\d+)/i))) {
      dmg = [num(m[1]), num(m[2])];
      const sp = line.match(/(?:speed|vitesse)\s*:?\s*(\d+(?:[.,]\d+)?)/i);
      if (sp) speed = num(sp[1]);
      continue;
    }
    if ((m = line.match(/^(?:speed|vitesse)\s*:?\s*(\d+(?:[.,]\d+)?)/i))) {
      speed = num(m[1]);
      continue;
    }
    if (/damage per second|dégâts par seconde/i.test(line)) continue;

    if (/^(use|utiliser)\s*:/i.test(raw)) {
      const u = parseOnUse(raw);
      if (u) { result.onUse = { duration: 20, cd: 120, ...u }; continue; }
      result.unparsed.push(raw);
      continue;
    }

    if ((m = line.match(/^\+\s*(\d+)\s+(.+?)\.?$/))) {
      const stat = PRIMARY.find(([re]) => re.test(m[2].trim()));
      if (stat) { add(stat[1], num(m[1])); continue; }
    }
    if ((m = line.match(/\+?\s*(\d+)\s*(?:attack power|à la puissance d['’]attaque|puissance d['’]attaque)/i) || line.match(/(?:attack power by|puissance d['’]attaque de)\s*(\d+)/i))) {
      add('ap', num(m[1]));
      continue;
    }
    if ((m = line.match(new RegExp(`(?:chance to hit|chances de toucher)[^0-9]*${PCT}`, 'i')) || line.match(new RegExp(`^\\+?${PCT}\\s*(?:hit|toucher)`, 'i')))) {
      add('hit', num(m[1]));
      continue;
    }
    if ((m = line.match(new RegExp(`(?:critical strike|coups? critiques?)[^0-9]*${PCT}`, 'i')) || line.match(new RegExp(`^\\+?${PCT}\\s*(?:crit|critique)`, 'i')))) {
      add('crit', num(m[1]));
      continue;
    }
    if ((m = line.match(new RegExp(`(?:dodged|parried|esquivée?s?|parée?s?)[^0-9]*${PCT}`, 'i')))) {
      add('expertise', num(m[1]));
      continue;
    }
    if ((m = line.match(new RegExp(`(?:attack speed|vitesse d['’]attaque)[^0-9]*${PCT}`, 'i')))) {
      add('haste', num(m[1]));
      continue;
    }
    if ((m = line.match(/(\d+)\s*(?:mana per 5|mana every 5|points? de mana toutes les 5|mana toutes les 5)/i))) {
      add('mp5', num(m[1]));
      continue;
    }
    if ((m = line.match(/increased\s+(.+?)\s*\+\s*(\d+)/i) || line.match(/compétence\s+(?:en\s+|aux\s+|avec les\s+)?(.+?)\s+(?:augmentée\s+de\s+)?\+?\s*(\d+)/i))) {
      const types = WEAPON_WORDS.filter(([re]) => re.test(m[1])).map(([, ty]) => ty);
      add('skill', num(m[2]));
      if (types.length) result.skillFor = types;
      continue;
    }
    if ((m = line.match(new RegExp(`(?:extra attack|attaque supplémentaire)[^%]*?${PCT}|${PCT}[^%]*?(?:extra attack|attaque supplémentaire)`, 'i')))) {
      add('extraAttack', num(m[1] || m[2]));
      continue;
    }
    if (IGNORE.test(line)) continue;
    result.unparsed.push(raw);
  }

  if (dmg) {
    result.weapon = { min: dmg[0], max: dmg[1], speed: speed || 2.0, type: weaponType || 'axe' };
    if (!result.type || !['weapon1h', 'weapon2h', 'ranged'].includes(result.type)) result.type = (speed || 2) >= 3 ? 'weapon2h' : 'weapon1h';
    if (result.type === 'ranged') result.weapon = null;
  }
  return result;
}

// ---- src/engine.js ----
// Moteur Monte-Carlo du sim Survie mêlée (WoW Forever).
// Table d’attaque et formules reprises de Classic (wowsims/sod, magey),
// modifiées par les changements Forever décrits dans data.js.


// Générateur pseudo-aléatoire déterministe (mulberry32).
function makeRng(seed) {
  let a = seed >>> 0;
  return function rng() {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function iterationSeed(base, i) {
  let h = (base ^ Math.imul(i + 1, 0x9e3779b1)) >>> 0;
  h = Math.imul(h ^ (h >>> 16), 0x85ebca6b) >>> 0;
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35) >>> 0;
  return (h ^ (h >>> 16)) >>> 0;
}

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

function byLevel(stats, level) {
  if (stats && (stats[60] || stats[30])) return stats[level] || {};
  return stats || {};
}

// Table d’attaque Classic contre une cible (en pourcentages).
function attackTable(level, bossLevel, skillBonus, expertise, M) {
  const baseSkill = level * 5;
  const skill = baseSkill + skillBonus;
  const defense = bossLevel * 5;
  const diff = defense - skill;
  const baseDiff = defense - baseSkill;

  let miss;
  let hitSuppression;
  if (diff > 10) {
    hitSuppression = (diff - 10) * 0.2;
    miss = 5 + diff * 0.2;
  } else {
    hitSuppression = 0;
    miss = 5 + diff * 0.1;
  }

  const dodge = Math.max(0, 5 + diff * 0.1 - expertise);
  const parry = Math.max(0, (baseDiff > 10 ? 5 + baseDiff * 0.6 : 5 + baseDiff * 0.1) - expertise);
  const glance = M.glancing ? Math.max(0, 10 + baseDiff * 2) : 0;
  const glanceMin = clamp(1.3 - 0.05 * diff, 0.01, 0.91);
  const glanceMax = clamp(1.2 - 0.03 * diff, 0.2, 0.99);

  let critSuppression = 0;
  if (M.critSuppression) {
    critSuppression = defense > baseSkill ? baseDiff * 0.2 : baseDiff * 0.04;
    if (bossLevel - level >= 3) critSuppression += 1.8;
  }

  return { skill, miss: Math.max(0, miss), hitSuppression, dodge, parry, glance, glanceMin, glanceMax, critSuppression };
}

function spellMissBase(levelDiff) {
  if (levelDiff <= 0) return 4;
  if (levelDiff === 1) return 5;
  if (levelDiff === 2) return 6;
  return 17 + (levelDiff - 3) * 11;
}

function onUseFromTrinket(tr) {
  if (!tr || tr.preset === 'none') return null;
  const preset = ON_USE_PRESETS[tr.preset];
  if (!preset) return null;
  const src = tr.preset === 'custom' ? { ...preset, ...tr } : preset;
  const value = Number(src.value) || 0;
  const duration = Number(src.duration) || 0;
  const cd = Number(src.cd) || 0;
  if (!value || !duration || !cd) return null;
  return { name: src.name, type: src.type, value, duration, cd };
}

// Transforme un profil (saisie de l’utilisateur) en personnage prêt à simuler.
function buildCharacter(profile) {
  const L = Number(profile.level) === 30 ? 30 : 60;
  const M = { ...defaultMechanics(L), ...(profile.mechanics || {}) };
  const fight = profile.fight || {};
  const bossLevel = Number(fight.bossLevel) || L + 3;

  const T = {};
  for (const def of TALENTS) {
    let v = clamp(Math.round(Number(profile.talents?.[def.id]) || 0), 0, def.max);
    if (def.minLevel && L < def.minLevel) v = 0;
    T[def.id] = v;
  }

  const race = RACES[profile.race] || RACES.orc;
  const classBase = BASE_STATS[L];
  const base = {};
  for (const k of ['str', 'agi', 'sta', 'int', 'spi']) base[k] = classBase[k] + (race.offsets[k] || 0);

  const add = { str: 0, agi: 0, sta: 0, int: 0, spi: 0, ap: 0, crit: 0, hit: 0, mp5: 0, expertise: 0, skill: 0, weaponDmg: 0, armorReduction: 0, windfuryAp: 0 };
  const statPct = [];
  const haste = [];
  let manaPotion = false;
  let manaRune = false;

  const gear = profile.gear || {};
  for (const k of Object.keys(add)) add[k] += Number(gear[k]) || 0;
  if (Number(gear.haste)) haste.push(Number(gear.haste));

  const usedGroups = new Set();
  const activeBuffs = [];
  for (const id of profile.buffs || []) {
    const def = BUFFS.find((b) => b.id === id);
    if (!def) continue;
    if (def.group) {
      if (usedGroups.has(def.group)) continue;
      usedGroups.add(def.group);
    }
    activeBuffs.push(def.id);
    const s = byLevel(def.stats, L);
    for (const [k, v] of Object.entries(s)) {
      if (k === 'statPct') statPct.push(v);
      else if (k === 'haste') haste.push(v);
      else if (k === 'manaPotion') manaPotion = true;
      else if (k === 'manaRune') manaRune = true;
      else if (k in add) add[k] += v;
    }
  }

  const twoHand = profile.twoHand !== false;
  const dw = !twoHand && !!profile.oh;
  const weaponsIn = [profile.mh, dw ? profile.oh : null];
  for (const w of weaponsIn) {
    if (!w) continue;
    if (w.enchant === 'agility') add.agi += twoHand ? 25 : 15;
    if (w.enchant === 'strength') add.str += 15;
    if (w.enchant === 'counterweight' && twoHand) haste.push(3);
  }

  const custom = profile.custom || {};
  add.ap += Number(custom.ap) || 0;
  add.crit += Number(custom.crit) || 0;

  if (profile.aspect === 'beast') add.ap += Number(M.beastAp) || 0;
  add.hit += T.surefooted * M.surefootedPerRank;

  const statMult = statPct.reduce((m, p) => m * (1 + p / 100), 1);
  const agiMult = statMult * (1 + (T.lightningReflexes * M.lightningReflexesPerRank) / 100);
  const strMult = statMult;

  const str = (base.str + add.str) * strMult;
  const agi = (base.agi + add.agi) * agiMult;
  const int = (base.int + add.int) * statMult;
  const spi = (base.spi + add.spi) * statMult;

  const levelAp = L * 2 - 20;
  const ap = levelAp + str * M.apPerStr + agi * M.apPerAgi + add.ap;
  const baseApForRacial = levelAp + base.str * M.apPerStr + base.agi * M.apPerAgi;
  const crit = M.baseCrit + agi / M.agiPerCrit + add.crit;
  const hit = add.hit;
  const hasteStatic = haste.reduce((m, h) => m * (1 + h / 100), 1);

  const manaMax = classBase.mana + Math.min(20, int) + Math.max(0, int - 20) * 15;
  const spiritTick = 15 + spi / 5;

  const peCrit = (T.predatorsEdge * M.predatorCritPerRank) / 100;
  const critMult = M.predatorCritMode === 'total' ? 2 * (1 + peCrit) : 1 + (1 + peCrit);

  const trackMult = fight.trackedType !== false ? 1 + (T.improvedTracking * M.improvedTrackingPerRank) / 100 : 1;
  const petActive = !!profile.pet?.enabled;
  const ffMult = petActive ? 1 + (T.focusedFire * M.focusedFirePerRank) / 100 : 1;
  const dmgMult = (1 + (Number(custom.dmgPct) || 0) / 100) * trackMult * ffMult;
  const savage = T.savageStrikes * M.savageStrikesPerRank;
  const meleeMult = dmgMult * (M.savageStrikesMode === 'damage' ? 1 + savage / 100 : 1);
  const specialCritBonus = M.savageStrikesMode === 'crit' ? savage : 0;

  const armor = Math.max(0, (Number(fight.bossArmor) || 0) - add.armorReduction);
  const armorMult = 1 - armor / (armor + 400 + 85 * L);

  const behind = fight.behind !== false;

  function makeWeapon(w, isOH) {
    const min = Math.max(0, Number(w.min) || 0);
    const max = Math.max(min, Number(w.max) || 0);
    const speed = Math.max(0.5, Number(w.speed) || 2);
    const skillBonus = add.skill + (race.skill[w.type] || 0);
    const mult = isOH ? (M.ohPenalty / 100) * (1 + (T.predatorsEdge * M.predatorOhPerRank) / 100) : 1;
    return {
      isOH, min, max, speed, type: w.type, enchant: w.enchant || 'none', flat: add.weaponDmg, mult,
      table: attackTable(L, bossLevel, skillBonus, add.expertise, M),
    };
  }
  const mh = makeWeapon(profile.mh || { min: 1, max: 2, speed: 2 }, false);
  const oh = dw ? makeWeapon(profile.oh, true) : null;

  const resourceful = 1 - (T.resourcefulness * M.resourcefulnessPerRank) / 100;
  const costs = {
    raptor: M.raptorMana * resourceful,
    mongoose: M.mongooseMana * resourceful,
    striderKick: ((classBase.mana * M.striderManaPct) / 100) * resourceful,
    counterattack: M.counterMana * resourceful,
    immolation: M.trapMana * resourceful,
  };

  const beingAttacked = !!fight.beingAttacked;
  const known = {
    mongoose: true,
    raptor: true,
    striderKick: T.striderKick > 0,
    counterattack: T.counterattack > 0 && beingAttacked,
    immolation: true,
  };
  const rotation = (profile.rotation || [])
    .filter((r) => r.enabled && known[r.id])
    .map((r) => ({ id: r.id, minMana: clamp(Number(r.minMana) || 0, 0, 100) }));
  const raptorEnabled = rotation.some((r) => r.id === 'raptor');
  const gcdRotation = rotation.filter((r) => !(r.id === 'raptor' && M.raptorMode !== 'instant'));
  const enabledCosts = rotation.map((r) => costs[r.id]);
  const minCost = enabledCosts.length ? Math.min(...enabledCosts) : 0;

  const cooldowns = [];
  if (profile.racial !== false) {
    if (race.cooldown === 'bloodFury') {
      cooldowns.push({ id: 'bloodFury', name: 'Fureur sanguinaire', type: 'ap', value: (baseApForRacial * M.bloodFuryPct) / 100, duration: 15, cd: 120 });
    } else if (race.cooldown === 'berserking') {
      cooldowns.push({ id: 'berserking', name: 'Berserker', type: 'haste', value: M.berserkingHaste, duration: 10, cd: 180 });
    }
  }
  (profile.trinkets || []).forEach((tr, i) => {
    const cd = onUseFromTrinket(tr);
    if (cd) cooldowns.push({ ...cd, id: `trinket${i}` });
  });

  const huntersMark = profile.huntersMark !== false;
  const exposePreyChance = huntersMark ? T.exposePrey * M.exposePreyChance : 0;
  const trapMiss = Math.max(1, spellMissBase(bossLevel - L) - hit - T.survivalTactics * M.survivalTacticsPerRank);
  const trapTicks = Math.max(1, Math.round(M.trapDuration / 3));

  return {
    level: L, bossLevel, M, T, race,
    stats: { str, agi, int, spi, ap, crit, hit, hasteStatic, mp5: add.mp5, expertise: add.expertise },
    strMult, agiMult, baseApForRacial,
    manaMax, spiritTick, baseMana: classBase.mana,
    mh, oh, dw, twoHand, behind,
    critMult, dmgMult, meleeMult, specialCritBonus, armor, armorMult,
    costs, rotation, gcdRotation, raptorEnabled, minCost, cooldowns,
    huntersMark, exposePreyChance,
    lacerating: T.laceratingStrikes > 0,
    deadlyAspects: T.deadlyAspects > 0 && profile.aspect === 'beast',
    windfuryAp: add.windfuryAp,
    extraAttackChance: Number(profile.extraAttackChance) || 0,
    resourcefulnessProc: T.resourcefulness > 0 ? M.resourcefulnessProc : 0,
    manaPotion, manaRune,
    trapMiss, trapTicks, trapMult: dmgMult * (1 + (T.cleverTraps * M.cleverTrapsPerRank) / 100),
    trapCd: M.trapCd * (1 - (T.survivalistsDiscipline * M.survivalistsDiscipline) / 100),
    beingAttacked, bossSwing: Math.max(0.5, Number(fight.bossSwing) || 2),
    playerDodge: Number(fight.playerDodge) || 0, playerParry: Number(fight.playerParry) || 0,
    pet: petActive ? (Number(profile.pet.dps) || 0) * ffMult : 0,
    activeBuffs,
  };
}

const METRIC_IDS = ['mh', 'oh', 'extra', 'raptor', 'mongoose', 'striderKick', 'counterattack', 'lacerating', 'immolation'];

function newMetrics() {
  const m = {};
  for (const id of METRIC_IDS) m[id] = { dmg: 0, casts: 0, hits: 0, crits: 0, miss: 0, dodge: 0, parry: 0, glance: 0, ticks: 0 };
  return m;
}

function newCycle() {
  return { gcdBusy: 0, uptime: {}, mb: { opened: 0, used: 0, wasted: 0, delay: 0 }, seq: new Map() };
}

// Simule un combat. `trace` ({ events: [], spans: [], limit }) reçoit le détail des `limit`
// premières secondes : attaques, techniques, procs, et périodes actives (buffs, fenêtres, saignement).
function simulateOnce(C, rng, duration, trace = null) {
  const M = C.M;
  const metrics = newMetrics();
  const cycle = newCycle();
  let t = 0;
  let mana = C.manaMax;
  let lastSpend = -100;
  let gcdReady = 0;
  const cdReady = { raptor: 0, mongoose: 0, striderKick: 0, counterattack: 0, immolation: 0 };
  let mbUntil = -1;
  let mbAvail = 0;
  let mbOpenAt = -1;
  let mbUsed = true;
  let caUntil = -1;
  let caAvail = 0;
  let rsQueued = false;
  let oomTime = 0;
  let potionReady = 0;
  let runeReady = 0;
  const procs = { exposePrey: 0, dodgeWindows: 0, parryWindows: 0, deadlyAspects: 0, windfury: 0, crusader: 0, potions: 0 };
  const cdReadyAt = C.cooldowns.map(() => 0);
  const auraNames = Object.fromEntries(C.cooldowns.map((cd) => [cd.id, cd.name]));

  const dyn = { ap: 0, str: 0, agi: 0, crit: 0 };
  let regenWhileCasting = 0;
  let haste = C.stats.hasteStatic;
  const auras = [];
  const auraStart = {};
  const lastCasts = [];

  let nextMH = 0;
  let nextOH = C.dw ? rng() * 0.3 : Infinity;
  let nextRegen = rng() * 2;
  let nextBoss = C.beingAttacked ? rng() * C.bossSwing : Infinity;
  let nextDecide = 0;
  const bleed = { perTick: 0, ticksLeft: 0, next: Infinity, start: -1 };
  const trap = { triggerAt: Infinity, perTick: 0, ticksLeft: 0, next: Infinity, start: -1 };

  // Trace détaillée (uniquement pour la chronologie et le journal).
  const limit = trace ? (trace.limit ?? duration) : 0;
  const openSpans = {};
  const ev = trace ? (kind, id, extra = {}) => {
    if (t > limit) return null;
    const e = { t, kind, id, mana, ...extra };
    trace.events.push(e);
    return e;
  } : null;
  function spanOpen(id, end) {
    if (!trace || t > limit) return;
    const s = { id, name: auraNames[id] || label(id), start: t, end };
    trace.spans.push(s);
    openSpans[id] = s;
  }
  function spanEnd(id, end) {
    if (openSpans[id]) openSpans[id].end = end;
  }
  const addUptime = (id, dt) => { cycle.uptime[id] = (cycle.uptime[id] || 0) + Math.max(0, dt); };

  const currentAP = () => C.stats.ap + dyn.ap + dyn.str * C.strMult * M.apPerStr + dyn.agi * C.agiMult * M.apPerAgi;
  const currentCrit = () => C.stats.crit + dyn.crit + (dyn.agi * C.agiMult) / M.agiPerCrit;
  const effHit = (tbl) => Math.max(0, C.stats.hit - tbl.hitSuppression);

  function setHaste(newHaste) {
    if (newHaste === haste) return;
    const ratio = haste / newHaste;
    if (nextMH > t && Number.isFinite(nextMH)) nextMH = t + (nextMH - t) * ratio;
    if (nextOH > t && Number.isFinite(nextOH)) nextOH = t + (nextOH - t) * ratio;
    haste = newHaste;
  }

  function applyEffect(a, sign) {
    if (a.stat === 'haste') {
      a.active = sign > 0;
      let hs = C.stats.hasteStatic;
      for (const o of auras) if (o.stat === 'haste' && o.active) hs *= 1 + o.value / 100;
      setHaste(hs);
    } else if (a.stat === 'regen') {
      regenWhileCasting += sign;
    } else {
      dyn[a.stat] += sign * a.value;
    }
  }

  function applyAura(id, stat, value, dur) {
    const existing = auras.find((a) => a.id === id);
    if (existing) {
      existing.until = t + dur;
      spanEnd(id, t + dur);
      return;
    }
    const a = { id, stat, value, until: t + dur, active: false };
    auras.push(a);
    auraStart[id] = t;
    spanOpen(id, t + dur);
    applyEffect(a, 1);
  }

  function expireAuras() {
    for (let i = auras.length - 1; i >= 0; i--) {
      const a = auras[i];
      if (a.until <= t) {
        auras.splice(i, 1);
        applyEffect(a, -1);
        addUptime(a.id, t - auraStart[a.id]);
        spanEnd(a.id, t);
        delete openSpans[a.id];
      }
    }
  }

  // Fenêtre pendant laquelle Mongoose Bite est utilisable.
  function openMongooseWindow(until) {
    if (t >= mbUntil) {
      if (!mbUsed) {
        cycle.mb.wasted++;
        addUptime('mbWindow', mbUntil - mbOpenAt);
      }
      mbOpenAt = t;
      mbUsed = false;
      cycle.mb.opened++;
      mbAvail = t + M.reaction;
      mbUntil = until;
      spanOpen('mbWindow', until);
    } else {
      mbUntil = Math.max(mbUntil, until);
      spanEnd('mbWindow', mbUntil);
    }
  }

  function consumeMongooseWindow() {
    if (!mbUsed) {
      mbUsed = true;
      cycle.mb.used++;
      cycle.mb.delay += t - mbOpenAt;
      addUptime('mbWindow', t - mbOpenAt);
      spanEnd('mbWindow', t);
    }
    mbUntil = -1;
  }

  function spend(cost) {
    mana -= cost;
    lastSpend = t;
  }

  function recordCast(id) {
    if (lastCasts.length === 2) {
      const key = `${lastCasts[0]}>${lastCasts[1]}>${id}`;
      cycle.seq.set(key, (cycle.seq.get(key) || 0) + 1);
    }
    lastCasts.push(id);
    if (lastCasts.length > 2) lastCasts.shift();
  }

  function weaponDamage(w, extraAp = 0) {
    const base = w.min + rng() * (w.max - w.min);
    return (base + ((currentAP() + extraAp) / M.apPerDps) * w.speed + w.flat) * w.mult;
  }

  function onHit(w, isWhite, isCrit, isExtra) {
    if (C.exposePreyChance > 0 && (isWhite || M.exposePreyOn === 'all')) {
      if (rng() * 100 < C.exposePreyChance) {
        openMongooseWindow(t + M.exposePreyWindow);
        procs.exposePrey++;
        if (ev) ev('proc', 'exposePrey');
      }
    }
    if (isWhite && C.deadlyAspects && rng() * 100 < M.deadlyAspectsChance) {
      applyAura('deadlyAspects', 'haste', M.deadlyAspectsHaste, M.deadlyAspectsDuration);
      procs.deadlyAspects++;
      if (ev) ev('proc', 'deadlyAspects');
    }
    if (w.enchant === 'crusader' && rng() < w.speed / 60) {
      applyAura(w.isOH ? 'crusaderOH' : 'crusaderMH', 'str', 100, 15);
      procs.crusader++;
      if (ev) ev('proc', w.isOH ? 'crusaderOH' : 'crusaderMH');
    }
    if (isCrit && C.resourcefulnessProc > 0 && rng() * 100 < C.resourcefulnessProc) {
      applyAura('resourcefulness', 'regen', 1, 30);
    }
    if (!isExtra && !w.isOH && C.windfuryAp > 0 && rng() * 100 < M.windfuryChance) {
      procs.windfury++;
      if (ev) ev('proc', 'windfury');
      whiteAttack(C.mh, C.windfuryAp, true);
    } else if (!isExtra && C.extraAttackChance > 0 && rng() * 100 < C.extraAttackChance) {
      if (ev) ev('proc', 'extraAttack');
      whiteAttack(C.mh, 0, true);
    }
  }

  function whiteAttack(w, extraAp = 0, isExtra = false) {
    const id = w.isOH ? 'oh' : isExtra ? 'extra' : 'mh';
    const m = metrics[id];
    const tbl = w.table;
    const e = ev ? ev('swing', id, { outcome: 'miss', dmg: 0 }) : null;
    m.casts++;
    const dwPenalty = C.dw && !rsQueued ? M.dwMissPenalty : 0;
    const miss = Math.max(0, tbl.miss + dwPenalty - effHit(tbl));
    const r = rng() * 100;
    let acc = miss;
    if (r < acc) { m.miss++; return; }
    acc += tbl.dodge;
    if (r < acc) { m.dodge++; if (e) e.outcome = 'dodge'; return; }
    if (!C.behind) {
      acc += tbl.parry;
      if (r < acc) { m.parry++; if (e) e.outcome = 'parry'; return; }
    }
    let dmg = weaponDamage(w, extraAp) * C.meleeMult * C.armorMult;
    let outcome = 'hit';
    acc += tbl.glance;
    if (r < acc) {
      dmg *= tbl.glanceMin + rng() * (tbl.glanceMax - tbl.glanceMin);
      m.glance++;
      outcome = 'glance';
    } else {
      acc += Math.max(0, currentCrit() - tbl.critSuppression);
      if (r < acc) { dmg *= C.critMult; m.crits++; outcome = 'crit'; } else m.hits++;
    }
    m.dmg += dmg;
    if (e) { e.outcome = outcome; e.dmg = dmg; }
    onHit(w, true, outcome === 'crit', isExtra);
  }

  function yellowAttack(id, raw, noAvoid = false) {
    const m = metrics[id];
    const tbl = C.mh.table;
    m.casts++;
    const r = rng() * 100;
    let acc = Math.max(0, tbl.miss - effHit(tbl));
    if (r < acc) { m.miss++; return { outcome: 'miss', dmg: 0 }; }
    if (!noAvoid) {
      acc += tbl.dodge;
      if (r < acc) { m.dodge++; return { outcome: 'dodge', dmg: 0 }; }
      if (!C.behind) {
        acc += tbl.parry;
        if (r < acc) { m.parry++; return { outcome: 'parry', dmg: 0 }; }
      }
    }
    const isCrit = rng() * 100 < currentCrit() + C.specialCritBonus - tbl.critSuppression;
    let dmg = raw() * C.meleeMult * C.armorMult;
    if (isCrit) { dmg *= C.critMult; m.crits++; } else m.hits++;
    m.dmg += dmg;
    onHit(C.mh, false, isCrit, false);
    return { outcome: isCrit ? 'crit' : 'hit', dmg };
  }

  function applyBleed(dmg) {
    const total = (dmg * M.laceratingPct) / 100;
    const ticks = Math.max(1, Math.round(M.laceratingDuration / M.laceratingTick));
    let pool = total;
    if (M.laceratingRefresh === 'rolling' && bleed.ticksLeft > 0) pool += bleed.perTick * bleed.ticksLeft;
    if (bleed.ticksLeft === 0) {
      bleed.start = t;
      spanOpen('bleed', t + ticks * M.laceratingTick);
    } else {
      spanEnd('bleed', t + ticks * M.laceratingTick);
    }
    bleed.perTick = pool / ticks;
    bleed.ticksLeft = ticks;
    bleed.next = t + M.laceratingTick;
  }

  // Résout une technique (le coût est déjà payé).
  function resolve(id) {
    switch (id) {
      case 'mongoose': {
        consumeMongooseWindow();
        cdReady.mongoose = t + M.mongooseCd;
        const res = yellowAttack('mongoose', () => weaponDamage(C.mh) + M.mongooseBonus);
        if (res.dmg > 0 && C.lacerating) applyBleed(res.dmg);
        return res;
      }
      case 'raptor':
        cdReady.raptor = t + M.raptorCd;
        return yellowAttack('raptor', () => weaponDamage(C.mh) + M.raptorBonus);
      case 'striderKick':
        cdReady.striderKick = t + M.striderCd;
        return yellowAttack('striderKick', () => (weaponDamage(C.mh) * M.striderWeaponPct) / 100);
      case 'counterattack':
        caUntil = -1;
        spanEnd('caWindow', t);
        cdReady.counterattack = t + M.counterCd;
        return yellowAttack('counterattack', () => (weaponDamage(C.mh) * M.counterWeaponPct) / 100 + M.counterBonus, true);
      case 'immolation':
        cdReady.immolation = t + C.trapCd;
        metrics.immolation.casts++;
        trap.triggerAt = t + M.trapArm;
        return { outcome: 'placed', dmg: 0 };
      default:
        return { outcome: 'hit', dmg: 0 };
    }
  }

  function cast(id) {
    const cost = C.costs[id];
    spend(cost);
    const onGcd = id !== 'raptor' || M.raptorMode === 'instant';
    if (onGcd) {
      gcdReady = t + M.gcd;
      cycle.gcdBusy += Math.min(M.gcd, duration - t);
    }
    recordCast(id);
    const e = ev ? ev('cast', id, { cost, gcd: onGcd }) : null;
    const res = resolve(id);
    if (e) { e.outcome = res.outcome; e.dmg = res.dmg; }
  }

  function usable(r) {
    const id = r.id;
    if (t < cdReady[id]) return false;
    const cost = C.costs[id];
    if (mana < cost) return false;
    if (r.minMana > 0 && (mana / C.manaMax) * 100 < r.minMana) return false;
    if (id === 'mongoose') return t < mbUntil && t >= mbAvail;
    if (id === 'counterattack') return t < caUntil && t >= caAvail;
    if (id === 'immolation') return trap.ticksLeft === 0 && trap.triggerAt === Infinity;
    return true;
  }

  function decide() {
    // Recharges hors GCD : raciaux, bijoux, potions.
    for (let i = 0; i < C.cooldowns.length; i++) {
      if (t >= cdReadyAt[i]) {
        const cd = C.cooldowns[i];
        applyAura(cd.id, cd.type, cd.value, cd.duration);
        cdReadyAt[i] = t + cd.cd;
        if (ev) ev('cooldown', cd.id, { name: cd.name });
      }
    }
    if (C.manaPotion && t >= potionReady && C.manaMax - mana >= 2250) {
      mana += 1350 + rng() * 900;
      potionReady = t + 120;
      procs.potions++;
      if (ev) ev('proc', 'potion');
    }
    if (C.manaRune && t >= runeReady && C.manaMax - mana >= 1500) {
      mana += 900 + rng() * 600;
      runeReady = t + 120;
      procs.potions++;
      if (ev) ev('proc', 'rune');
    }

    if (C.raptorEnabled && M.raptorMode !== 'instant') {
      const r = C.rotation.find((x) => x.id === 'raptor');
      if (M.raptorMode === 'nextSwing') {
        if (!rsQueued && usable(r)) rsQueued = true;
      } else if (usable(r)) {
        cast('raptor');
      }
    }

    if (t >= gcdReady) {
      for (const r of C.gcdRotation) {
        if (usable(r)) { cast(r.id); break; }
      }
    }

    // Prochain moment où une décision peut changer.
    let next = Infinity;
    const consider = (x) => { if (x > t && x < next) next = x; };
    consider(gcdReady);
    for (const r of C.rotation) consider(cdReady[r.id]);
    if (mbUntil > t) consider(mbAvail);
    if (caUntil > t) consider(caAvail);
    for (const x of cdReadyAt) consider(x);
    if (C.manaPotion) consider(potionReady);
    if (C.manaRune) consider(runeReady);
    nextDecide = next;
  }

  function mhSwing() {
    if (rsQueued) {
      rsQueued = false;
      const cost = C.costs.raptor;
      if (mana >= cost && t >= cdReady.raptor) {
        spend(cost);
        recordCast('raptor');
        const e = ev ? ev('cast', 'raptor', { cost, gcd: false }) : null;
        const res = resolve('raptor');
        if (e) { e.outcome = res.outcome; e.dmg = res.dmg; }
      } else {
        whiteAttack(C.mh);
      }
    } else {
      whiteAttack(C.mh);
    }
    nextMH = t + C.mh.speed / haste;
  }

  function regenTick() {
    let gain = (C.stats.mp5 * 2) / 5;
    if (t - lastSpend >= 5) gain += C.spiritTick;
    else if (regenWhileCasting > 0) gain += C.spiritTick * 0.5;
    mana = Math.min(C.manaMax, mana + gain);
    nextRegen = t + 2;
    if (ev) ev('regen', 'mana', { gain });
  }

  function bossSwing() {
    const r = rng() * 100;
    if (r < C.playerDodge) {
      openMongooseWindow(t + M.dodgeWindow);
      procs.dodgeWindows++;
      if (ev) ev('proc', 'dodge');
    } else if (r < C.playerDodge + C.playerParry && C.T.counterattack > 0) {
      if (t >= caUntil) {
        caAvail = t + M.reaction;
        spanOpen('caWindow', t + 5);
      } else {
        spanEnd('caWindow', t + 5);
      }
      caUntil = t + 5;
      procs.parryWindows++;
      if (ev) ev('proc', 'parry');
    }
    nextBoss = t + C.bossSwing;
  }

  function trapTrigger() {
    trap.triggerAt = Infinity;
    if (rng() * 100 < C.trapMiss) {
      metrics.immolation.miss++;
      if (ev) ev('proc', 'trapResist');
      return;
    }
    metrics.immolation.hits++;
    trap.ticksLeft = C.trapTicks;
    trap.perTick = (M.trapDamage * C.trapMult) / C.trapTicks;
    trap.next = t + M.trapDuration / C.trapTicks;
    trap.start = t;
    spanOpen('trap', t + M.trapDuration);
  }

  decide();
  while (true) {
    let nextExpire = Infinity;
    for (const a of auras) if (a.until < nextExpire) nextExpire = a.until;
    const tn = Math.min(nextExpire, nextRegen, bleed.next, trap.triggerAt, trap.next, nextBoss, nextMH, nextOH, nextDecide);
    if (tn > duration) {
      if (mana < C.minCost) oomTime += duration - t;
      break;
    }
    if (mana < C.minCost) oomTime += tn - t;
    t = tn;

    if (tn === nextExpire) expireAuras();
    else if (tn === nextRegen) regenTick();
    else if (tn === bleed.next) {
      let dmg = bleed.perTick;
      let crit = false;
      if (M.laceratingCanCrit && rng() * 100 < currentCrit() + C.specialCritBonus - C.mh.table.critSuppression) {
        dmg *= C.critMult;
        metrics.lacerating.crits++;
        crit = true;
      }
      metrics.lacerating.dmg += dmg;
      metrics.lacerating.ticks++;
      if (ev) ev('tick', 'lacerating', { dmg, outcome: crit ? 'crit' : 'hit' });
      bleed.ticksLeft--;
      if (bleed.ticksLeft > 0) bleed.next = t + M.laceratingTick;
      else {
        bleed.next = Infinity;
        addUptime('bleed', t - bleed.start);
      }
    } else if (tn === trap.triggerAt) trapTrigger();
    else if (tn === trap.next) {
      metrics.immolation.dmg += trap.perTick;
      metrics.immolation.ticks++;
      if (ev) ev('tick', 'immolation', { dmg: trap.perTick, outcome: 'hit' });
      trap.ticksLeft--;
      if (trap.ticksLeft > 0) trap.next = t + M.trapDuration / C.trapTicks;
      else {
        trap.next = Infinity;
        addUptime('trap', t - trap.start);
      }
    } else if (tn === nextBoss) bossSwing();
    else if (tn === nextMH) mhSwing();
    else if (tn === nextOH) {
      whiteAttack(C.oh);
      nextOH = t + C.oh.speed / haste;
    } else nextDecide = Infinity;

    decide();
  }

  // Clôture des périodes encore actives à la fin du combat.
  for (const a of auras) addUptime(a.id, duration - auraStart[a.id]);
  if (bleed.ticksLeft > 0) addUptime('bleed', duration - bleed.start);
  if (trap.ticksLeft > 0) addUptime('trap', duration - trap.start);
  if (!mbUsed) {
    addUptime('mbWindow', Math.min(mbUntil, duration) - mbOpenAt);
    if (mbUntil <= duration) cycle.mb.wasted++;
  }
  if (trace) for (const s of trace.spans) s.end = Math.min(s.end, duration, limit);

  let total = 0;
  for (const id of METRIC_IDS) total += metrics[id].dmg;
  return { damage: total, duration, metrics, oomTime, procs, manaEnd: mana, cycle };
}

const LABELS = {
  mh: 'Attaque auto (main droite)',
  oh: 'Attaque auto (main gauche)',
  extra: 'Attaques supplémentaires',
  raptor: 'Raptor Strike',
  mongoose: 'Mongoose Bite',
  striderKick: 'Strider Kick',
  counterattack: 'Counterattack',
  lacerating: 'Lacerating Strikes (saignement)',
  immolation: 'Piège d’immolation',
  pet: 'Familier (estimation)',
  bloodFury: 'Fureur sanguinaire',
  berserking: 'Berserker',
  deadlyAspects: 'Deadly Aspects',
  crusaderMH: 'Croisé (main droite)',
  crusaderOH: 'Croisé (main gauche)',
  resourcefulness: 'Resourcefulness (regen)',
  mbWindow: 'Fenêtre Mongoose Bite',
  caWindow: 'Fenêtre Counterattack',
  bleed: 'Saignement',
  trap: 'Piège (dégâts sur la durée)',
  exposePrey: 'Expose Prey',
  dodge: 'Esquive',
  parry: 'Parade',
  windfury: 'Furie-des-vents',
  extraAttack: 'Attaque supplémentaire',
  potion: 'Potion de mana',
  rune: 'Rune démoniaque',
  trapResist: 'Piège résisté',
};

const CAST_IDS = ['raptor', 'mongoose', 'striderKick', 'counterattack', 'immolation'];

function label(id) {
  return LABELS[id] || id;
}

// Accumulateur : permet de lancer les itérations par paquets sans bloquer l’interface.
function createAccumulator() {
  return { n: 0, dps: [], damage: 0, duration: 0, oom: 0, metrics: newMetrics(), procs: {}, cycle: newCycle() };
}

function simulateBatch(C, profile, acc, start, count, seed = 1) {
  const fight = profile.fight || {};
  const base = Math.max(10, Number(fight.duration) || 180);
  const variance = clamp(Number(fight.variance) || 0, 0, 50) / 100;
  for (let i = start; i < start + count; i++) {
    const rng = makeRng(iterationSeed(seed, i));
    const duration = base * (1 - variance + 2 * variance * rng());
    const res = simulateOnce(C, rng, duration);
    const dps = res.damage / duration + C.pet;
    acc.dps.push(dps);
    acc.damage += res.damage;
    acc.duration += duration;
    acc.oom += res.oomTime;
    for (const id of METRIC_IDS) {
      const a = acc.metrics[id];
      const b = res.metrics[id];
      for (const k of Object.keys(a)) a[k] += b[k];
    }
    for (const [k, v] of Object.entries(res.procs)) acc.procs[k] = (acc.procs[k] || 0) + v;
    const c = acc.cycle;
    c.gcdBusy += res.cycle.gcdBusy;
    for (const [k, v] of Object.entries(res.cycle.uptime)) c.uptime[k] = (c.uptime[k] || 0) + v;
    for (const k of Object.keys(c.mb)) c.mb[k] += res.cycle.mb[k];
    for (const [k, v] of res.cycle.seq) c.seq.set(k, (c.seq.get(k) || 0) + v);
    acc.n++;
  }
  return acc;
}

function summarizeCycle(C, acc) {
  const n = acc.n || 1;
  const c = acc.cycle;
  const minutes = acc.duration / 60 || 1;
  const names = Object.fromEntries(C.cooldowns.map((cd) => [cd.id, cd.name]));
  const uptime = Object.entries(c.uptime)
    .map(([id, secs]) => ({ id, name: names[id] || label(id), pct: (secs / acc.duration) * 100 }))
    .filter((u) => u.pct > 0.05)
    .sort((a, b) => b.pct - a.pct);
  const totalSeq = [...c.seq.values()].reduce((s, v) => s + v, 0) || 1;
  const sequences = [...c.seq.entries()]
    .sort((a, b) => b[1] - a[1])
    .slice(0, 8)
    .map(([key, count]) => ({ ids: key.split('>'), perFight: count / n, pct: (count / totalSeq) * 100 }));
  const perMinute = CAST_IDS
    .map((id) => ({ id, name: label(id), perMinute: acc.metrics[id].casts / minutes }))
    .filter((x) => x.perMinute > 0);
  return {
    gcdUsage: (c.gcdBusy / acc.duration) * 100,
    perMinute,
    uptime,
    mb: {
      opened: c.mb.opened / n,
      used: c.mb.used / n,
      wasted: c.mb.wasted / n,
      usedPct: c.mb.opened ? (c.mb.used / c.mb.opened) * 100 : 0,
      avgDelay: c.mb.used ? c.mb.delay / c.mb.used : 0,
    },
    sequences,
  };
}

function summarize(C, acc) {
  const n = acc.n || 1;
  const mean = acc.dps.reduce((s, x) => s + x, 0) / n;
  const variance = acc.dps.reduce((s, x) => s + (x - mean) ** 2, 0) / Math.max(1, n - 1);
  const sd = Math.sqrt(variance);
  const sorted = [...acc.dps].sort((a, b) => a - b);
  const avgDuration = acc.duration / n;
  const breakdown = [];
  for (const id of METRIC_IDS) {
    const m = acc.metrics[id];
    if (m.dmg <= 0 && m.casts <= 0) continue;
    const landed = m.hits + m.crits + m.glance;
    breakdown.push({
      id,
      name: label(id),
      dps: m.dmg / acc.duration,
      share: 0,
      casts: m.casts / n,
      ticks: m.ticks / n,
      avgHit: m.ticks ? m.dmg / m.ticks : landed ? m.dmg / landed : 0,
      critPct: m.ticks ? (m.crits / m.ticks) * 100 : landed ? (m.crits / landed) * 100 : 0,
      missPct: m.casts ? (m.miss / m.casts) * 100 : 0,
      dodgePct: m.casts ? (m.dodge / m.casts) * 100 : 0,
      parryPct: m.casts ? (m.parry / m.casts) * 100 : 0,
      glancePct: m.casts ? (m.glance / m.casts) * 100 : 0,
    });
  }
  if (C.pet > 0) breakdown.push({ id: 'pet', name: label('pet'), dps: C.pet, share: 0, casts: 0, ticks: 0, avgHit: 0, critPct: 0, missPct: 0, dodgePct: 0, parryPct: 0, glancePct: 0 });
  const totalDps = breakdown.reduce((s, b) => s + b.dps, 0) || 1;
  for (const b of breakdown) b.share = (b.dps / totalDps) * 100;
  breakdown.sort((a, b) => b.dps - a.dps);
  const procs = {};
  for (const [k, v] of Object.entries(acc.procs)) procs[k] = v / n;
  return {
    iterations: acc.n,
    mean,
    sd,
    se: sd / Math.sqrt(n),
    min: sorted[0] ?? 0,
    max: sorted[sorted.length - 1] ?? 0,
    p5: sorted[Math.floor(0.05 * (sorted.length - 1))] ?? 0,
    p95: sorted[Math.floor(0.95 * (sorted.length - 1))] ?? 0,
    avgDuration,
    oomPct: (acc.oom / acc.duration) * 100,
    breakdown,
    procs,
    cycle: summarizeCycle(C, acc),
    dps: acc.dps,
  };
}

function runSim(profile, { iterations = 1000, seed = 1 } = {}) {
  const C = buildCharacter(profile);
  const acc = createAccumulator();
  simulateBatch(C, profile, acc, 0, iterations, seed);
  return summarize(C, acc);
}

// Détail d’un combat pour la chronologie et le journal.
function combatTrace(profile, { seed = 1, seconds = 60 } = {}) {
  const C = buildCharacter(profile);
  const rng = makeRng(iterationSeed(seed, 0));
  const trace = { events: [], spans: [], limit: seconds };
  const res = simulateOnce(C, rng, seconds, trace);
  return {
    events: trace.events,
    spans: trace.spans.filter((s) => s.end > s.start),
    duration: seconds,
    damage: res.damage,
    gcd: C.M.gcd,
    raptorMode: C.M.raptorMode,
    manaMax: C.manaMax,
    dw: C.dw,
  };
}

// Feuille de personnage (valeurs affichées dans l’interface).
function characterSheet(profile) {
  const C = buildCharacter(profile);
  const tbl = C.mh.table;
  const hit = Math.max(0, C.stats.hit - tbl.hitSuppression);
  return {
    C,
    ap: C.stats.ap,
    agi: C.stats.agi,
    str: C.stats.str,
    crit: C.stats.crit,
    critVsBoss: C.stats.crit - tbl.critSuppression,
    hit: C.stats.hit,
    yellowMiss: Math.max(0, tbl.miss - hit),
    whiteMiss: Math.max(0, tbl.miss + (C.dw ? C.M.dwMissPenalty : 0) - hit),
    hitCap: tbl.miss + tbl.hitSuppression,
    dodge: tbl.dodge,
    parry: C.behind ? 0 : tbl.parry,
    glance: tbl.glance,
    glancePenalty: (1 - (tbl.glanceMin + tbl.glanceMax) / 2) * 100,
    skill: tbl.skill,
    armor: C.armor,
    armorReduction: (1 - C.armorMult) * 100,
    critMult: C.critMult,
    mana: C.manaMax,
    costs: C.costs,
    haste: (C.stats.hasteStatic - 1) * 100,
    swing: C.mh.speed / C.stats.hasteStatic,
    ohMult: C.oh ? C.oh.mult * 100 : null,
    exposePrey: C.exposePreyChance,
    trapMiss: C.trapMiss,
  };
}

// Poids des stats : mêmes graines pour chaque variante (nombres aléatoires communs).
// Les écarts sont volontairement larges : la hâte décale tous les événements et
// rend la comparaison bruitée avec de petits écarts.
const addGear = (key, n) => (p) => { p.gear[key] = (Number(p.gear[key]) || 0) + n; };

const STAT_DELTAS = [
  { key: 'agi', label: 'Agilité', delta: 50, apply: addGear('agi', 50) },
  { key: 'str', label: 'Force', delta: 50, apply: addGear('str', 50) },
  { key: 'hit', label: 'Toucher (par %)', delta: 2, apply: addGear('hit', 2) },
  { key: 'crit', label: 'Critique (par %)', delta: 2, apply: addGear('crit', 2) },
  { key: 'expertise', label: 'Réduction esquive/parade (par %)', delta: 2, apply: addGear('expertise', 2) },
  { key: 'skill', label: 'Compétence d’arme (par point)', delta: 5, apply: addGear('skill', 5) },
  { key: 'haste', label: 'Hâte (par %)', delta: 5, apply: addGear('haste', 5) },
  {
    key: 'weapon', label: 'DPS d’arme MD (par point)', delta: 5,
    apply: (p) => { const s = Number(p.mh.speed) || 2; p.mh.min = (Number(p.mh.min) || 0) + 5 * s; p.mh.max = (Number(p.mh.max) || 0) + 5 * s; },
  },
];

const AP_DELTA = 100;

function profileVariants(profile) {
  const clone = () => JSON.parse(JSON.stringify(profile));
  const variants = [{ key: 'base', profile: clone() }];
  const apP = clone();
  addGear('ap', AP_DELTA)(apP);
  variants.push({ key: 'ap', profile: apP });
  for (const d of STAT_DELTAS) {
    const p = clone();
    d.apply(p);
    variants.push({ key: d.key, profile: p });
  }
  return variants;
}

// Écart moyen et erreur type appariée entre deux séries de DPS jouées avec les mêmes graines.
function pairedDiff(a, b) {
  const n = Math.min(a.length, b.length);
  if (!n) return { mean: 0, se: 0 };
  let sum = 0;
  for (let i = 0; i < n; i++) sum += b[i] - a[i];
  const mean = sum / n;
  let sq = 0;
  for (let i = 0; i < n; i++) sq += (b[i] - a[i] - mean) ** 2;
  return { mean, se: Math.sqrt(sq / Math.max(1, n - 1) / n) };
}

// `runs[key]` = DPS de chaque combat (même ordre de graines pour toutes les variantes).
function statWeightsFromRuns(runs) {
  const ap = pairedDiff(runs.base, runs.ap);
  const perAp = ap.mean / AP_DELTA;
  const rows = [{ key: 'ap', label: 'Puissance d’attaque', dpsPerPoint: perAp, ep: 1, epError: 0 }];
  for (const d of STAT_DELTAS) {
    const diff = pairedDiff(runs.base, runs[d.key]);
    const per = diff.mean / d.delta;
    rows.push({
      key: d.key, label: d.label, dpsPerPoint: per,
      ep: perAp > 0 ? per / perAp : 0,
      epError: perAp > 0 ? (1.96 * diff.se) / d.delta / perAp : 0,
    });
  }
  return rows;
}

function computeStatWeights(profile, { iterations = 2000, seed = 7 } = {}) {
  const runs = {};
  for (const v of profileVariants(profile)) runs[v.key] = runSim(v.profile, { iterations, seed }).dps;
  return statWeightsFromRuns(runs);
}
